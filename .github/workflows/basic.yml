name: Docker Baseline CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  basic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check Git LFS artifacts
        run: |
          git lfs ls-files
          test -s bin/chrome-linux64-150.0.7871.46.zip
          unzip -tq bin/chrome-linux64-150.0.7871.46.zip

      - name: Prepare Docker environment
        run: |
          make init

      - name: Docker baseline checks
        run: |
          make config
          make build
          make up
          make ps
          make composer-install
          make npm-install
          make assets-build
          make eslint-check
          make test-unit
          make test-db-reset CONFIRM=testdb
          make test-integration
          make test-functional
          make test-functional-panther
          make phpstan-check

      - name: Cleanup Docker
        if: always()
        run: make down
