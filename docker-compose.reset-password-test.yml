services:
  reset-password-postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: reset_password_concurrency_test
      POSTGRES_USER: reset_password_test
      POSTGRES_PASSWORD: disposable_reset_password_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reset_password_test", "-d", "reset_password_concurrency_test"]
      interval: 1s
      timeout: 3s
      retries: 30
